[project]
name = "candidate-intelligence-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "extract-msg>=0.56.0",
    "fastapi[standard]>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "lancedb>=0.36.0",
    "ollama>=0.6.2",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-docx>=1.2.0",
    "spacy>=3.8.13",
    "sqlalchemy>=2.0.51",
    "structlog>=24.0.0",
]

[project.scripts]
candidate-intelligence-platform = "candidate_intelligence_platform:main"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "ollama: marks tests as requiring live Ollama instance (skipped by default, run with --run-ollama)",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
